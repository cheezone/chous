name: End of life

# Once a week, read the makers' end-of-life data: has a version ended since the
# last sync, or does the data now contradict a recorded date? A failed run means
# run `pnpm run sync`, or read the log. Quotes are not re-checked here: a page
# rewording a sentence is not news (run `pnpm run sources` when adding one).
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eol:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: End-of-life data
        run: pnpm run sync --check
